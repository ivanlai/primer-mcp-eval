[project]
name = "expenses"
version = "0.1.0"
description = "A small command-line expense tracker"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
expenses = "expenses.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
